      float damp = smoothstep(0.15, 0.28, wetField);
      float mirror = smoothstep(0.26, 0.39, wetField);
      float farWet = smoothstep(300.0, 1000.0, dist);
      wet = mix(wet, 1.0, farWet);
      mirror = mix(mirror, 1.0, farWet * 0.94);

      // The view opens on the dry rim of a shallow sheet: dry crust behind,
      // mirror water ahead. A world-space band keeps the transition stable.
      float shoreBand = smoothstep(-45.0, 8.0, p.y);
      wet *= mix(1.0, 0.12, shoreBand);
      mirror *= mix(1.0, 0.10, shoreBand);
      damp *= mix(1.0, 0.25, shoreBand);

      // ---------------------------------------------------------------
      // Salt crust — ivory and cool-grey mineral modulation, two scales of
      // the generated crust texture, faded gently with distance.
      // ---------------------------------------------------------------
      float macroWarm = texture2D(uNoise, p * 0.0011 + vec2(0.51, 0.30)).r;
      float macroCool = texture2D(uNoise, p * 0.00053 + vec2(0.23, 0.81)).g;
      vec3 saltCol = mix(uSaltWarm, uSaltWhite, smoothstep(0.28, 0.74, macroWarm));
      saltCol = mix(saltCol, uSaltCool, smoothstep(0.44, 0.82, macroCool) * 0.34);

      vec2 saltUvA = p * 0.055;
      vec2 saltUvB = rotate(p, 0.61) * 0.028 + vec2(0.37, 0.21);
      vec3 saltA = texture2D(uSalt, saltUvA).rgb;
      vec3 saltB = texture2D(uSalt, saltUvB).rgb;
      float saltDetailFade = 1.0 - smoothstep(40.0, 900.0, dist);
      vec3 saltTex = mix(saltB, saltA, mix(0.5, 0.78, saltDetailFade));

      // Broad mineral plates give the mid-ground its dry/wet patchwork.
      float plates = texture2D(uNoise, p * 0.0042 + vec2(0.07, 0.31)).r;
      float plateRange = smoothstep(12.0, 260.0, dist) * (1.0 - smoothstep(700.0, 1600.0, dist));
      saltCol *= 1.0 + (plates - 0.5) * 0.16 * plateRange;

      // Only part of the flat is crusty; elsewhere a smooth water film hides
      // the polygons, which keeps the network from reading as a mesh.
      float crustMask = smoothstep(0.30, 0.62, plates);
      saltCol *= mix(vec3(0.97), saltTex * 1.08, mix(0.5, 1.0, saltDetailFade) * (0.58 + 0.42 * crustMask));

      // A faint blue-grey veil where water is thin, never brown or muddy.
      vec3 wetSalt = mix(saltCol, saltCol * uWaterTint * 1.35 + uWaterTint * 0.02, 0.06 + damp * 0.28);
      wetSalt *= mix(1.0, 0.935, wet);

      // A brighter dry lip plus a darker damp band make the waterline read.
      float shore = smoothstep(0.255, 0.315, wetField) * (1.0 - smoothstep(0.315, 0.40, wetField));
      float dampBand = smoothstep(0.31, 0.38, wetField) * (1.0 - smoothstep(0.38, 0.47, wetField));
      wetSalt *= 1.0 + shore * 0.10 - dampBand * 0.07;

      // ---------------------------------------------------------------
      // Surface lighting. The flat surface uses the same sun/moon/hemi
      // palette as the rest of the scene, so transitions stay coherent.
      // ---------------------------------------------------------------
      vec3 ambient = (uHemiSky * 0.72 + uHemiGround * 0.28) * uHemiIntensity * 0.52
                   + uAmbientColor * uAmbientIntensity;
      float sunUp = max(uSunDir.y, 0.0);
      float moonUp = max(uMoonDir.y, 0.0);
      vec3 direct = uSunLightColor * uSunLightIntensity * (0.35 + 0.65 * sunUp) * sunUp
                  + uMoonLightColor * uMoonLightIntensity * (0.25 + 0.75 * moonUp) * moonUp;
      // Salt has a very high albedo, but the whole scene is displayed through
      // ACES: keep the crust near 1.0 in linear light so the mirror still reads.
      vec3 litSalt = wetSalt * (ambient + direct * 0.94) * 0.55;

      // Rake the low sun/moon across the crust ridges. The normal map only
      // lifts dry or damp salt; open water keeps its ripple normal.
      vec3 saltN = texture2D(uSaltNormal, saltUvA).rgb * 2.0 - 1.0;
      vec3 saltNB = texture2D(uSaltNormal, saltUvB).rgb * 2.0 - 1.0;
      vec3 saltDir = normalize(vec3(saltN.x + saltNB.x * 0.6, 1.0, saltN.y + saltNB.y * 0.6));
      vec3 lightDir = normalize(
        uSunDir * max(uSunLightIntensity, 0.0) +
        uMoonDir * max(uMoonLightIntensity, 0.0) + vec3(0.0, 0.0001, 0.0)
      );
      float rake = clamp(dot(saltDir, lightDir), 0.0, 1.0);
      litSalt *= mix(1.0, 0.90 + 0.22 * rake, (1.0 - wet) * (1.0 - farWet));

      // Delicate caustic-like variation in the shallowest foreground.
      float nearWater = (1.0 - smoothstep(8.0, 105.0, dist)) * wet;
      float causticField = texture2D(uNoise, p * 0.17 + vec2(uTime * 0.0031, -uTime * 0.0021)).b;
      float caustic = pow(max(0.0, (causticField - 0.52) / 0.48), 3.0);
      litSalt += uSunColor * caustic * 0.045 * uSunLightIntensity * nearWater * (1.0 - farWet);

      // ---------------------------------------------------------------
      // Ripples — two very slow normal fields plus long, almost imperceptible
      // swells. Slopes stay tiny: this is a film of water, not an ocean.
      // ---------------------------------------------------------------
      vec2 rippleUvA = p * 0.115 + vec2(uTime * 0.0011, uTime * -0.0007);
      vec2 rippleUvB = rotate(p, 1.21) * 0.037 + vec2(-uTime * 0.0006, uTime * 0.0009);
      vec2 rippleA = texture2D(uRipple, rippleUvA).rg * 2.0 - 1.0;
      vec2 rippleB = texture2D(uRipple, rippleUvB).rg * 2.0 - 1.0;
      vec2 slope = rippleA * 0.55 + rippleB * 0.75;

      float swell1 = sin(dot(p, vec2(0.052, 0.079)) + uTime * 0.085);
      float swell2 = cos(dot(p, vec2(-0.091, 0.037)) + uTime * 0.061);
      slope += vec2(swell1, swell2) * 0.11;

      float rippleDetail = 1.0 - smoothstep(35.0, 950.0, dist);
      slope *= mix(0.12, 1.0, rippleDetail) * 0.072 * uChop;
      vec3 waterNormal = normalize(vec3(slope.x, 1.0, slope.y));

      // ---------------------------------------------------------------
      // Planar reflection, with a slow ripple distortion and a tiny
      // self-shadowing of the crests. Four soft taps are used only when the
      // weather calls for a diffused reflection.
      // ---------------------------------------------------------------
      vec2 reflUv = vReflCoord.xy / max(vReflCoord.w, 0.0001);
      vec2 distort = waterNormal.xz * mix(0.013, 0.031, 1.0 - farFade);
      reflUv = clamp(reflUv + distort, vec2(0.002), vec2(0.998));

      vec3 refl = texture2D(uReflection, reflUv).rgb;
      if (uReflectionBlur > 0.00001) {
        float br = uReflectionBlur;
        refl += texture2D(uReflection, clamp(reflUv + vec2(br, 0.0), vec2(0.002), vec2(0.998))).rgb;
        refl += texture2D(uReflection, clamp(reflUv + vec2(0.0, br), vec2(0.002), vec2(0.998))).rgb;
        refl += texture2D(uReflection, clamp(reflUv - vec2(br, br), vec2(0.002), vec2(0.998))).rgb;
        refl *= 0.25;
      }

      // Keep the reflected sky clean and luminous; only a whisper of the
      // water tint keeps it from looking like a compositing trick.
      refl *= mix(vec3(1.0), uWaterTint * 1.35, 0.025);

      float NdotV = clamp(dot(waterNormal, viewDir), 0.0, 1.0);
      // A thin film over white salt reflects a little more than open water at
      // steep angles; the lift keeps the foreground from going chalk-white.
      float fresnel = 0.30 + 0.70 * pow(1.0 - NdotV, 2.5);
      float mirrorWeight = clamp(
        uReflectionStrength * wet * (0.10 + 0.90 * fresnel) * (0.46 + 0.54 * mirror),
        0.0, 0.972
      );
      // The water film is only a few centimetres deep near the viewer: let the
      // crust read through it, and save the clean mirror for the distance.
      mirrorWeight *= mix(0.85, 1.0, smoothstep(12.0, 110.0, dist));

      vec3 col = mix(litSalt, refl, mirrorWeight);

      // A cool, very thin film colour in the translucent shallows.
      col += uWaterTint * (1.0 - mirrorWeight) * wet * 0.025;

      // Sun/moon glints: broad enough to read as a reflection path, narrow
      // enough not to become a decorative spotlight.
      vec3 reflectedDir = reflect(-viewDir, waterNormal);
      float sunDot = max(dot(reflectedDir, uSunDir), 0.0);
      float moonDot = max(dot(reflectedDir, uMoonDir), 0.0);
      float sunSpec = pow(sunDot, 900.0) * 2.4 + pow(sunDot, 60.0) * 0.30;
      float moonSpec = pow(moonDot, 1200.0) * 1.6 + pow(moonDot, 90.0) * 0.06;
      vec3 specular = uGlintColor * (
        sunSpec * uSunLightIntensity * 0.12 * uGlintStrength +
        moonSpec * uMoonLightIntensity * 0.10
      ) * wet * (0.45 + 0.55 * mirror);
      col += specular;

      // Tiny crystalline sparkle on salt and water in the near field.
      float sparkleHash = texture2D(uNoise, p * 4.7 + vec2(uTime * 0.003, -uTime * 0.002)).b;
      float sparkle = smoothstep(0.965, 0.995, sparkleHash) * (1.0 - smoothstep(3.0, 110.0, dist));
      col += uGlintColor * sparkle * 0.018 * (uSunLightIntensity + uMoonLightIntensity) * uGlintStrength;

      // ---------------------------------------------------------------
      // Atmospheric perspective. A squared exponential keeps the middle
      // distance clear while dissolving the finite plane into the horizon.
      // ---------------------------------------------------------------
      float fogFactor = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
      fogFactor = max(fogFactor, smoothstep(15000.0, 30000.0, dist));

      vec3 groundDir = normalize(vWorldPos - cameraPosition + vec3(0.0001, 0.0, 0.0));
      vec3 sunHoriz = normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + vec3(0.0001, 0.0, 0.0));
      float sunAz = pow(max(dot(normalize(vec3(groundDir.x, 0.0, groundDir.z)), sunHoriz), 0.0), 5.0);
      vec3 fogCol = mix(uFogColor, uHazeSun, sunAz * clamp(uSunLightIntensity * 0.22, 0.0, 0.5));
      fogCol = mix(fogCol, uHazeSun, 0.0);
      col = mix(col, fogCol, clamp(fogFactor, 0.0, 0.998));

      // Dither the long gradients.
      col += (hash12(gl_FragCoord.xy + fract(uTime) * 19.3) - 0.5) * 0.0014;
      gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  const reflectionTarget = new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    type: THREE.UnsignedByteType,
    depthBuffer: true,
    stencilBuffer: false
  });
  reflectionTarget.texture.colorSpace = THREE.LinearSRGBColorSpace;
  reflectionTarget.texture.wrapS = THREE.ClampToEdgeWrapping;
  reflectionTarget.texture.wrapT = THREE.ClampToEdgeWrapping;
  reflectionTarget.texture.generateMipmaps = false;

  const reflectionMatrix = new THREE.Matrix4();

  const surfaceMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uSalt: { value: saltTexture },
      uSaltNormal: { value: saltNormalTexture },
      uRipple: { value: rippleTexture },
      uNoise: { value: cloudNoiseTexture },
      uReflection: { value: reflectionTarget.texture },
      uReflectionMatrix: { value: reflectionMatrix },
      uSaltWhite: { value: new THREE.Color() },
      uSaltWarm: { value: new THREE.Color() },
      uSaltCool: { value: new THREE.Color() },
      uWaterTint: { value: new THREE.Color() },
      uGlintColor: { value: new THREE.Color() },
      uFogColor: { value: new THREE.Color() },
      uHazeSun: { value: new THREE.Color() },
      uSunColor: { value: new THREE.Color() },
      uSunLightColor: { value: new THREE.Color() },
      uMoonLightColor: { value: new THREE.Color() },
      uHemiSky: { value: new THREE.Color() },
      uHemiGround: { value: new THREE.Color() },
      uAmbientColor: { value: new THREE.Color() },
      uSunDir: { value: new THREE.Vector3(0, 1, 0) },
      uMoonDir: { value: new THREE.Vector3(0, 1, 0) },
      uTime: { value: 0 },
      uSunLightIntensity: { value: 2.45 },
      uMoonLightIntensity: { value: 0 },
      uHemiIntensity: { value: 1.1 },
      uAmbientIntensity: { value: 0.1 },
      uReflectionStrength: { value: 1 },
      uReflectionBlur: { value: 0.00035 },
      uGlintStrength: { value: 1 },
      uChop: { value: 1 },
      uHazeAmount: { value: 0.7 },
      uFogDensity: { value: 0.000052 }
    },
    vertexShader: surfaceVertex,
    fragmentShader: surfaceFragment,
    fog: false
  });

  const saltSurface = new THREE.Mesh(new THREE.PlaneGeometry(62000, 62000), surfaceMaterial);
  saltSurface.rotation.x = -Math.PI / 2;
  saltSurface.position.y = 0;
  scene.add(saltSurface);

  /* =========================================================================
     8. STATE → UNIFORMS
     ========================================================================= */

  const _colA = new THREE.Color();
  const _colB = new THREE.Color();
  const lightCenter = new THREE.Vector3(0, 0, -90);

  function applyLiveState(elapsed) {
    const c = app.live.colors;
    const n = app.live.numbers;
    const v = app.live.vectors;

    // --- Sky ------------------------------------------------------------
    const su = skyMaterial.uniforms;
    su.uZenith.value.copy(c.skyZenith);
    su.uMid.value.copy(c.skyMid);
    su.uHorizon.value.copy(c.skyHorizon);
    su.uHaze.value.copy(c.hazeColor);
    su.uHazeSun.value.copy(c.hazeSunColor);
    su.uSunColor.value.copy(c.sunColor);
    su.uSunGlow.value.copy(c.sunGlowColor);
    su.uMoonColor.value.copy(c.moonColor);
    su.uCloudLit.value.copy(c.cloudLit);
    su.uCloudShadow.value.copy(c.cloudShadow);
    su.uCloudWarm.value.copy(c.cloudWarm);
    su.uSunDir.value.copy(v.sunDir);
    su.uMoonDir.value.copy(v.moonDir);
    su.uSunDisk.value = n.sunDiskIntensity;
    su.uSunGlowIntensity.value = n.sunGlowIntensity;
    su.uMoonDisk.value = n.moonDiskIntensity;
    su.uMoonGlowIntensity.value = n.moonGlowIntensity;
    su.uCloudCover.value = n.cloudCover;
    su.uCloudOpacity.value = n.cloudOpacity;
    su.uCirrusOpacity.value = n.cirrusOpacity;
    su.uOvercastness.value = n.overcastness;
    su.uStarVisibility.value = n.starVisibility;
    su.uMilkyVisibility.value = n.milkyVisibility;
    su.uHazeAmount.value = n.hazeAmount;
    su.uTime.value = elapsed;

    // --- Ground / water -------------------------------------------------
    const gu = surfaceMaterial.uniforms;
    gu.uSaltWhite.value.copy(c.saltWhite);
    gu.uSaltWarm.value.copy(c.saltWarm);
    gu.uSaltCool.value.copy(c.saltCool);
    gu.uWaterTint.value.copy(c.waterTint);
    gu.uGlintColor.value.copy(c.glintColor);
    gu.uFogColor.value.copy(c.fogColor);
    gu.uHazeSun.value.copy(c.hazeSunColor);
    gu.uSunColor.value.copy(c.sunColor);
    gu.uSunLightColor.value.copy(c.sunLightColor);
    gu.uMoonLightColor.value.copy(c.moonLightColor);
    gu.uHemiSky.value.copy(c.hemiSky);
    gu.uHemiGround.value.copy(c.hemiGround);
    gu.uAmbientColor.value.copy(c.ambientColor);
    gu.uSunDir.value.copy(v.sunDir);
    gu.uMoonDir.value.copy(v.moonDir);
    gu.uSunLightIntensity.value = n.sunLightIntensity;
    gu.uMoonLightIntensity.value = n.moonLightIntensity;
    gu.uHemiIntensity.value = n.hemiIntensity;
    gu.uAmbientIntensity.value = n.ambientIntensity;
    gu.uReflectionStrength.value = n.reflectionStrength;
    gu.uReflectionBlur.value = n.reflectionBlur;
    gu.uGlintStrength.value = n.glintStrength;
    gu.uChop.value = n.chop;
    gu.uHazeAmount.value = n.hazeAmount;
    gu.uFogDensity.value = n.fogDensity;
    gu.uTime.value = elapsed;

    // --- Lights (used by islands, cacti and the standard-material props) --
    sunLight.color.copy(c.sunLightColor);
    sunLight.intensity = n.sunLightIntensity;
    sunLight.position.copy(lightCenter).addScaledVector(v.sunDir, 9000);
    sunLight.target.position.copy(lightCenter);

    moonLight.color.copy(c.moonLightColor);
    moonLight.intensity = n.moonLightIntensity;
    moonLight.position.copy(lightCenter).addScaledVector(v.moonDir, 9000);
    moonLight.target.position.copy(lightCenter);

    hemiLight.color.copy(c.hemiSky);
    hemiLight.groundColor.copy(c.hemiGround);
    hemiLight.intensity = n.hemiIntensity;

    ambientLight.color.copy(c.ambientColor);
    ambientLight.intensity = n.ambientIntensity;

    // --- Atmosphere -----------------------------------------------------
    scene.fog.color.copy(c.fogColor);
    scene.fog.density = n.fogDensity;
    renderer.toneMappingExposure = n.exposure;

    // --- Mountains ------------------------------------------------------
    for (const mat of mountainMaterials) {
      const u = mat.uniforms;
      const far = mat.userData.far;
      u.uHaze.value.copy(c.fogColor).lerp(c.hazeColor, 0.34);
      if (far) {
        _colA.copy(c.mountainHigh).lerp(c.fogColor, 0.16);
        _colB.copy(c.mountainLow).lerp(c.mountainHigh, 0.58);
        u.uBase.value.copy(_colA);
        u.uPeak.value.copy(_colB);
      } else {
        _colA.copy(c.mountainHigh);
        _colB.copy(c.mountainLow);
        u.uBase.value.copy(_colA);
        u.uPeak.value.copy(_colB);
      }
      u.uSunDir.value.copy(v.sunDir);
      _colA.copy(c.sunGlowColor).lerp(c.moonColor, clamp(n.moonLightIntensity / 0.7, 0, 0.55));
      u.uRimColor.value.copy(_colA);
      const rimBase = far ? 0.11 : 0.2;
      u.uRimStrength.value = rimBase * clamp(n.sunLightIntensity * 0.42 + n.moonLightIntensity * 0.12, 0, 1.15);
      u.uHazeMix.value = mat.userData.hazeMix * (0.9 + n.hazeAmount * 0.22);
    }
  }

  /* =========================================================================
     8.5 CLICK EASTER EGG (concentric ripples + salt spray) AND LOW MIST
     Both are pooled once and only toggled per frame — no allocation at runtime.
     ========================================================================= */

  const rippleGeo = new THREE.RingGeometry(0.66, 1.0, 72);
  const ripplePool = [];
  const rippleGroup = new THREE.Group();
  scene.add(rippleGroup);
  const RIPPLE_SLOTS = MOBILE ? 8 : 16;
  for (let i = 0; i < RIPPLE_SLOTS; i++) {
    const mesh = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({
      color: 0xe4f6ff,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      toneMapped: false,
      fog: false
    }));
    mesh.rotation.x = -Math.PI / 2;
    mesh.visible = false;
    mesh.renderOrder = 8;
    rippleGroup.add(mesh);
    ripplePool.push({ mesh, t: 0, life: 2.6, r0: 1, r1: 10 });
  }
  let rippleCursor = 0;

  const SPRAY_COUNT = MOBILE ? 48 : 108;
  const sprayPositions = new Float32Array(SPRAY_COUNT * 3);
  const sprayVelocity = new Float32Array(SPRAY_COUNT * 3);
  const sprayLife = new Float32Array(SPRAY_COUNT);
  for (let i = 0; i < SPRAY_COUNT; i++) sprayPositions[i * 3 + 1] = -9999;
  const sprayGeometry = new THREE.BufferGeometry();
  sprayGeometry.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
  const sprayMaterial = new THREE.PointsMaterial({
    color: 0xf2fbff,
    size: 0.13,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    toneMapped: false,
    fog: false
  });
  const sprayPoints = new THREE.Points(sprayGeometry, sprayMaterial);
  sprayPoints.frustumCulled = false;
  sprayPoints.visible = false;
  sprayPoints.renderOrder = 9;
  scene.add(sprayPoints);
  let sprayCursor = 0;
  let sprayAlive = 0;

  function spawnSpray(point) {
    const n = MOBILE ? 22 : 40;
    for (let i = 0; i < n; i++) {
      const idx = sprayCursor % SPRAY_COUNT;
      sprayCursor++;
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 1.6;
      sprayPositions[idx * 3] = point.x + Math.cos(a) * r;
      sprayPositions[idx * 3 + 1] = 0.06 + Math.random() * 0.14;
      sprayPositions[idx * 3 + 2] = point.z + Math.sin(a) * r;
      const speed = 0.7 + Math.random() * 1.9;
      sprayVelocity[idx * 3] = Math.cos(a) * speed * 0.5;
      sprayVelocity[idx * 3 + 1] = 1.5 + Math.random() * 2.6;
      sprayVelocity[idx * 3 + 2] = Math.sin(a) * speed * 0.5;
      sprayLife[idx] = 0.85 + Math.random() * 0.55;
    }
    sprayAlive = Math.min(SPRAY_COUNT, sprayAlive + n);
    sprayPoints.visible = true;
  }

  function spawnRipples(point) {
    const rings = 4;
    for (let i = 0; i < rings; i++) {
      const slot = ripplePool[(rippleCursor + i) % ripplePool.length];
      slot.mesh.position.set(point.x, 0.02 + i * 0.0015, point.z);
      slot.mesh.visible = true;
      slot.mesh.scale.setScalar(1);
      slot.mesh.material.opacity = 0;
      slot.t = -i * 0.24;
      slot.life = 2.8;
      slot.r0 = 1.1 + i * 0.7;
      slot.r1 = 13 + i * 8;
    }
    rippleCursor = (rippleCursor + rings) % ripplePool.length;
    spawnSpray(point);
  }

  function updateRipples(dt) {
    for (const r of ripplePool) {
      if (!r.mesh.visible) continue;
      r.t += dt;
      if (r.t < 0) continue;
      const p = r.t / r.life;
      if (p >= 1) {
        r.mesh.visible = false;
        r.mesh.material.opacity = 0;
        continue;
      }
      const scale = r.r0 + (r.r1 - r.r0) * Math.pow(p, 0.55);
      r.mesh.scale.setScalar(scale);
      r.mesh.material.opacity = Math.pow(1 - p, 1.8) * 0.46;
    }
  }

  let sprayNeedsUpdate = false;
  function updateSpray(dt) {
    if (sprayAlive <= 0) {
      if (sprayPoints.visible) sprayPoints.visible = false;
      return;
    }
    let alive = 0;
    for (let i = 0; i < SPRAY_COUNT; i++) {
      if (sprayLife[i] <= 0) continue;
      sprayLife[i] -= dt;
      if (sprayLife[i] <= 0) {
        sprayPositions[i * 3 + 1] = -9999;
        continue;
      }
      sprayVelocity[i * 3 + 1] -= 7.2 * dt;
      sprayPositions[i * 3] += sprayVelocity[i * 3] * dt;
      sprayPositions[i * 3 + 1] += sprayVelocity[i * 3 + 1] * dt;
      sprayPositions[i * 3 + 2] += sprayVelocity[i * 3 + 2] * dt;
      if (sprayPositions[i * 3 + 1] < 0.02) {
        sprayLife[i] = 0;
        sprayPositions[i * 3 + 1] = -9999;
        continue;
      }
      alive++;
    }
    sprayAlive = alive;
    sprayNeedsUpdate = true;
    if (sprayNeedsUpdate) {
      sprayGeometry.attributes.position.needsUpdate = true;
      sprayNeedsUpdate = false;
    }
    sprayPoints.visible = alive > 0;
  }

  // --- Low mist banks: horizontal, soft-edged, drifting slowly -----------
  const mistTexture = (() => {
    const size = 256;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, 'rgba(255,255,255,0.90)');
    grad.addColorStop(0.42, 'rgba(255,255,255,0.42)');
    grad.addColorStop(0.74, 'rgba(255,255,255,0.12)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  })();

  const mistLayers = [];
  (function buildMistBanks() {
    const count = MOBILE ? 5 : 10;
    let seedState = 0x2f6c1b;
    const rnd = () => {
      seedState = (seedState * 1664525 + 1013904223) >>> 0;
      return seedState / 4294967296;
    };
    for (let i = 0; i < count; i++) {
      const w = 260 + rnd() * 520;
      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, w * 0.52),
        new THREE.MeshBasicMaterial({
          map: mistTexture,
          color: 0xdfeef2,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          side: THREE.DoubleSide,
          fog: false
        })
      );
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(
        (rnd() - 0.5) * 900,
        0.85 + rnd() * 1.9,
        -70 - rnd() * 1150
      );
      mesh.renderOrder = 4;
      scene.add(mesh);
      mistLayers.push({
        mesh,
        base: 0.026 + rnd() * 0.042,
        phase: rnd() * Math.PI * 2,
        drift: 0.25 + rnd() * 0.55
      });
    }
  })();

  function updateMist(elapsedTime) {
    for (const layer of mistLayers) {
      const pulse = 0.62 + 0.38 * Math.sin(elapsedTime * 0.09 + layer.phase);
      layer.mesh.material.opacity = layer.base * pulse;
      layer.mesh.material.color.copy(scene.fog.color);
      layer.mesh.position.x += Math.sin(elapsedTime * 0.035 + layer.phase) * layer.drift * 0.012;
    }
  }

  const clickRaycaster = new THREE.Raycaster();
  const clickPointer = new THREE.Vector2();
  const clickPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const clickHit = new THREE.Vector3();
  let pressX = 0;
  let pressY = 0;
  let pressTime = 0;

  canvas.addEventListener('pointerdown', (e) => {
    pressX = e.clientX;
    pressY = e.clientY;
    pressTime = performance.now();
  });

  canvas.addEventListener('pointerup', (e) => {
    if (Math.hypot(e.clientX - pressX, e.clientY - pressY) > 7) return;
    if (performance.now() - pressTime > 700) return;
    clickPointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    clickPointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    clickRaycaster.setFromCamera(clickPointer, camera);
    if (!clickRaycaster.ray.intersectPlane(clickPlane, clickHit)) return;
    if (clickHit.distanceTo(camera.position) > 1400) return;
    spawnRipples(clickHit);
    hideHint();
  });

  /* =========================================================================
     8.6 WEATHER PARTICLES — 3D rain + storm lightning
     The rain lives inside the scene rather than in a CSS overlay, so the planar
     reflection actually picks it up: drizzle dimples the mirror, a storm shreds
     it. That is the difference the presets are supposed to communicate.
     ========================================================================= */

  const RAIN_COUNT = MOBILE ? 320 : 900;
  const RAIN_SPAN = { w: 72, h: 36, d: 72 };
  const rainPositions = new Float32Array(RAIN_COUNT * 6);
  const rainDrops = [];
  for (let i = 0; i < RAIN_COUNT; i++) {
    rainDrops.push({
      x: (Math.random() - 0.5) * RAIN_SPAN.w,
      y: Math.random() * RAIN_SPAN.h - 14,
      z: (Math.random() - 0.5) * RAIN_SPAN.d,
      len: 0.55 + Math.random() * 1.5,
      speed: 24 + Math.random() * 20
    });
  }
  const rainGeometry = new THREE.BufferGeometry();
  rainGeometry.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
  const rainMaterial = new THREE.LineBasicMaterial({
    color: 0xdae7f1,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    fog: false
  });
  const rainLines = new THREE.LineSegments(rainGeometry, rainMaterial);
  rainLines.frustumCulled = false;
  rainLines.visible = false;
  scene.add(rainLines);

  function updateRain(dt) {
    const wx = app.weather;
    const amount = wx === 'storm' ? 1 : (wx === 'lightrain' ? 0.52 : 0);
    if (!amount) {
      if (rainLines.visible) {
        rainLines.visible = false;
        rainMaterial.opacity = 0;
      }
      return;
    }
    const storm = wx === 'storm';
    const slantX = storm ? 2.1 : 0.9;
    const slantZ = storm ? 0.8 : 0.35;
    const cx = camera.position.x;
    const cy = camera.position.y;
    const cz = camera.position.z;
    const halfW = RAIN_SPAN.w / 2;
    const halfD = RAIN_SPAN.d / 2;
    for (let i = 0; i < RAIN_COUNT; i++) {
      const d = rainDrops[i];
      d.y -= d.speed * dt * (storm ? 1.45 : 1);
      if (d.y < -14) d.y += RAIN_SPAN.h;
      if (d.x - cx > halfW) d.x -= RAIN_SPAN.w;
      else if (d.x - cx < -halfW) d.x += RAIN_SPAN.w;
      if (d.z - cz > halfD) d.z -= RAIN_SPAN.d;
      else if (d.z - cz < -halfD) d.z += RAIN_SPAN.d;
      const o = i * 6;
      const wy = cy + d.y;
      rainPositions[o] = d.x;
      rainPositions[o + 1] = wy;
      rainPositions[o + 2] = d.z;
      rainPositions[o + 3] = d.x - slantX * d.len * 0.42;
      rainPositions[o + 4] = wy + d.len * (storm ? 2.1 : 1.5);
      rainPositions[o + 5] = d.z - slantZ * d.len * 0.42;
    }
    rainGeometry.attributes.position.needsUpdate = true;
    // 小雨只画一半的雨丝：密度本身就是"档"的一部分，不只是透明度
    rainGeometry.setDrawRange(0, storm ? RAIN_COUNT * 2 : Math.round(RAIN_COUNT * 1.1));
    rainLines.visible = true;
    rainMaterial.opacity = (storm ? 0.42 : 0.24) * (app.time === 'night' ? 0.68 : 1);
  }

  // 暴雨闪电：只抬曝光与环境光，不改任何几何；晴天/小雨恒为 0。
  let lightning = 0;
  let nextBolt = 5 + Math.random() * 7;
  function updateLightning(dt) {
    if (app.weather !== 'storm') {
      lightning = Math.max(0, lightning - dt * 6);
      nextBolt = 5 + Math.random() * 7;
      return;
    }
    nextBolt -= dt;
    if (nextBolt <= 0) {
      nextBolt = 6 + Math.random() * 10;
      lightning = 1;
    }
    lightning = Math.max(0, lightning - dt * 7.5);
  }

  /* =========================================================================
     9. PLANAR REFLECTION (half-resolution, scene only — no ground)
     ========================================================================= */

  const mirrorCamera = new THREE.PerspectiveCamera(52, 1, 0.4, 220000);
  const textureBias = new THREE.Matrix4().set(
    0.5, 0.0, 0.0, 0.5,
    0.0, 0.5, 0.0, 0.5,
    0.0, 0.0, 0.5, 0.5,
    0.0, 0.0, 0.0, 1.0
  );

  const _fwd = new THREE.Vector3();
  const _look = new THREE.Vector3();
  const _up = new THREE.Vector3();

  let reflectionScale = MOBILE ? 0.4 : 0.6;

  function resizeReflectionTarget() {
    const drawing = renderer.getDrawingBufferSize(new THREE.Vector2());
    const cap = MOBILE ? 680 : 1280;
    let rw = Math.max(280, Math.round(drawing.x * reflectionScale));
    rw = Math.min(cap, rw);
    const aspect = camera.aspect;
    let rh = Math.max(160, Math.round(rw / aspect));
    rh = Math.min(Math.round(cap * 0.66), rh);
    reflectionTarget.setSize(rw, rh);
  }

  function renderPlanarReflection() {
    const camPos = camera.position;

    _fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
    _look.copy(camPos).addScaledVector(_fwd, 120);
    _look.y = -_look.y;

    _up.set(0, 1, 0).applyQuaternion(camera.quaternion);
    _up.y = -_up.y;

    mirrorCamera.position.set(camPos.x, -camPos.y, camPos.z);
    mirrorCamera.up.copy(_up);
    mirrorCamera.lookAt(_look);
    mirrorCamera.updateMatrixWorld(true);
    mirrorCamera.projectionMatrix.copy(camera.projectionMatrix);
    mirrorCamera.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
    mirrorCamera.near = camera.near;
    mirrorCamera.far = camera.far;
    mirrorCamera.matrixWorldInverse.copy(mirrorCamera.matrixWorld).invert();

    reflectionMatrix
      .copy(textureBias)
      .multiply(mirrorCamera.projectionMatrix)
      .multiply(mirrorCamera.matrixWorldInverse);

    skyMaterial.uniforms.uInvProjection.value.copy(mirrorCamera.projectionMatrixInverse);
    skyMaterial.uniforms.uCameraWorld.value.copy(mirrorCamera.matrixWorld);

    saltSurface.visible = false;
    // The reflection target stores linear light. Tone mapping happens once,
    // in the salt/water shader, when the mirror is composited on screen.
    const previousToneMapping = renderer.toneMapping;
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.setRenderTarget(reflectionTarget);
    renderer.clear();
    renderer.render(scene, mirrorCamera);
    renderer.setRenderTarget(null);
    renderer.toneMapping = previousToneMapping;
    saltSurface.visible = true;
  }

  resizeReflectionTarget();

  /* =========================================================================
     10. UI — independent time / weather controls, auto orbit, reset
     ========================================================================= */

  const timeButtons = Array.from(document.querySelectorAll('#time-options [data-time]'));
  const weatherButtons = Array.from(document.querySelectorAll('#weather-options [data-weather]'));
  const orbitButton = document.getElementById('orbit-toggle');
  const hintEl = document.getElementById('hint');

  function syncPresetButtons() {
    for (const b of timeButtons) {
      b.setAttribute('aria-pressed', String(b.dataset.time === app.time));
    }
    for (const b of weatherButtons) {
      b.setAttribute('aria-pressed', String(b.dataset.weather === app.weather));
    }
  }

  function selectTime(timeId) {
    if (app.time === timeId) return;
    app.time = timeId;
    app.target = buildPreset(app.time, app.weather);
    syncPresetButtons();
    hideHint();
  }

  function selectWeather(weatherId) {
    if (app.weather === weatherId) return;
    app.weather = weatherId;
    app.target = buildPreset(app.time, app.weather);
    syncPresetButtons();
    hideHint();
  }

  for (const b of timeButtons) b.addEventListener('click', () => selectTime(b.dataset.time));
  for (const b of weatherButtons) b.addEventListener('click', () => selectWeather(b.dataset.weather));

  function setAutoOrbit(on) {
    app.autoOrbit = on;
    controls.autoRotate = on && !resetTween;
    orbitButton.setAttribute('aria-pressed', String(on));
  }

  orbitButton.addEventListener('click', () => {
    setAutoOrbit(!app.autoOrbit);
    hideHint();
  });

  let hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hintEl.classList.add('is-hidden');
  }
  setTimeout(hideHint, 11000);

  let resetTween = null;

  // 任何一次飞行（机位预设 / 重置 / 上帝视角）都先把自动环绕真正关掉：
  // 只改 controls.autoRotate 而不同步 app.autoOrbit，会让按钮和 __bw.orbit 说谎，
  // 也会让环绕在飞行结束后"自己回来"。
  function startFly(position, target, duration = 1.95, onDone = null) {
    resetTween = {
      t: 0,
      duration,
      fromPos: camera.position.clone(),
      fromTarget: controls.target.clone(),
      toPos: position.clone(),
      toTarget: target.clone(),
      onDone
    };
    setAutoOrbit(false);
    hideHint();
  }

  const viewButtons = Array.from(document.querySelectorAll('#view-options [data-view]'));
  function syncViewButtons(activeId) {
    for (const b of viewButtons) b.setAttribute('aria-pressed', String(b.dataset.view === activeId));
  }
  for (const b of viewButtons) {
    b.addEventListener('click', () => {
      const preset = VIEW_PRESETS[b.dataset.view];
      if (!preset) return;
      startFly(preset.position, preset.target);
      syncViewButtons(b.dataset.view);
    });
  }

  controls.addEventListener('start', () => {
    hideHint();
    if (resetTween) {
      resetTween = null;
      controls.autoRotate = app.autoOrbit;
    }
    if (app.autoOrbit) setAutoOrbit(false);
  });

  /* ---------- 方向键沿镜头视线移动 / 双击复位（v1） ---------- */
  const navKeys = Object.create(null);
  function isNavKey(k) {
    return k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' ||
      k === 'w' || k === 'a' || k === 's' || k === 'd' ||
      k === 'W' || k === 'A' || k === 'S' || k === 'D';
  }
  window.addEventListener('keydown', (e) => {
    if (!isNavKey(e.key)) return;
    navKeys[e.key] = true;
    if (app.autoOrbit) setAutoOrbit(false);
    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { if (isNavKey(e.key)) navKeys[e.key] = false; });
  window.addEventListener('blur', () => { for (const k in navKeys) navKeys[k] = false; });
  function applyArrowPan(dt) {
    const kf = ((navKeys.ArrowUp || navKeys.w || navKeys.W) ? 1 : 0) - ((navKeys.ArrowDown || navKeys.s || navKeys.S) ? 1 : 0);
    const ks = ((navKeys.ArrowRight || navKeys.d || navKeys.D) ? 1 : 0) - ((navKeys.ArrowLeft || navKeys.a || navKeys.A) ? 1 : 0);
    if (!kf && !ks) return;
    const dist = camera.position.distanceTo(controls.target);
    const step = 34 * clamp(dist / 40, 0.6, 3.2) * dt;
    // 前后沿镜头视线（含俯仰）移动；左右平移保持水平
    const fwd = camera.getWorldDirection(new THREE.Vector3()).normalize();
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    const next = controls.target.clone()
      .addScaledVector(fwd, kf * step)
      .addScaledVector(right, ks * step);
    next.x = clamp(next.x, -320, 320);
    next.z = clamp(next.z, -360, 260);
    next.y = clamp(next.y, 0.55, 260);
    const delta = next.clone().sub(controls.target);
    controls.target.copy(next);
    camera.position.add(delta);
  }
  canvas.addEventListener('dblclick', () => {
    setAutoOrbit(false);
    startFly(OPENING.position, OPENING.target, 1.2);
    syncViewButtons('opening');
  });

  /* ---------------------------------------------------------------------
     God view — same single floating button as the rest of the gallery.
     Flies the camera high above the salt flat, and back to where it was.
     --------------------------------------------------------------------- */
  (function initGodView() {
    const btn = document.createElement('button');
    btn.id = 'god-view';
    btn.type = 'button';
    btn.textContent = '上帝视角';
    btn.setAttribute('aria-label', 'Toggle god view');
    btn.setAttribute('aria-pressed', 'false');
    btn.style.cssText = [
      'position:fixed', 'right:26px', 'top:84px', 'z-index:90',
      'padding:10px 16px', 'font-size:12px', 'letter-spacing:.22em',
      'background:rgba(10,22,30,.3)', 'color:#eaf2f6',
      'border:1px solid rgba(255,255,255,.16)', 'border-radius:999px',
      '-webkit-backdrop-filter:blur(14px) saturate(140%) brightness(.7)',
      'backdrop-filter:blur(14px) saturate(140%) brightness(.7)',
      'text-shadow:0 1px 3px rgba(0,12,18,.45)',
      'cursor:pointer', 'font-family:inherit',
      'transition:background .25s, border-color .25s'
    ].join(';');
    document.body.appendChild(btn);

    const GOD_POSITION = new THREE.Vector3(0, 260, 300);
    const GOD_TARGET = new THREE.Vector3(0, 0, -180);
    let home = null;
    let on = false;

    // 精确返回：等飞行 tween 真正跑完再落位，并顺手清掉 OrbitControls 的
    // 阻尼残余。用定时器硬吸附会把"返回途中用户拖拽"直接吞掉，也会留下偏移。
    function restoreHome(H) {
      if (on) return;
      camera.position.copy(H.position);
      controls.target.copy(H.target);
      camera.fov = H.fov;
      camera.updateProjectionMatrix();
      camera.lookAt(controls.target);
      controls.maxDistance = H.maxDistance;
      // enableDamping=false 跑一帧，OrbitControls 会把 sphericalDelta / panOffset 归零
      const damping = controls.enableDamping;
      controls.enableDamping = false;
      controls.update();
      controls.enableDamping = damping;
      app.autoOrbit = false;
      setAutoOrbit(false);
    }

    btn.addEventListener('click', () => {
      on = !on;
      btn.textContent = on ? '返回原位' : '上帝视角';
      btn.setAttribute('aria-pressed', String(on));
      setAutoOrbit(false);
      if (on) {
        home = { position: camera.position.clone(), target: controls.target.clone(), fov: camera.fov, maxDistance: controls.maxDistance };
        controls.maxDistance = 620;
        startFly(GOD_POSITION, GOD_TARGET, 1.55);
        syncViewButtons('');
      } else if (home) {
        const H = home;
        home = null;
        startFly(H.position, H.target, 1.35, () => restoreHome(H));
      }
    });
  })();

  setAutoOrbit(app.autoOrbit);
  syncPresetButtons();

  /* =========================================================================
     11. SPARSE SHOOTING STAR (night only, never rebuilt)
     ========================================================================= */

  const shootPositions = new Float32Array(6);
  const shootGeometry = new THREE.BufferGeometry();
  shootGeometry.setAttribute('position', new THREE.BufferAttribute(shootPositions, 3));
  const shootMaterial = new THREE.LineBasicMaterial({
    color: 0xd9e8ff,
    transparent: true,
    opacity: 0,
    blending: THREE.AdditiveBlending,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });
  const shootingStar = new THREE.Line(shootGeometry, shootMaterial);
  shootingStar.frustumCulled = false;
  shootingStar.renderOrder = 20;
  shootingStar.visible = false;
  scene.add(shootingStar);

  const shootState = {
    active: false,
    timer: 17 + Math.random() * 16,
    progress: 0,
    duration: 1.35,
    start: new THREE.Vector3(),
    end: new THREE.Vector3()
  };

  function spawnShootingStar() {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
    const up = new THREE.Vector3().crossVectors(right, forward).normalize();
    const dir = forward.clone()
      .addScaledVector(right, (Math.random() - 0.5) * 0.9)
      .addScaledVector(up, 0.18 + Math.random() * 0.55)
      .normalize();
    if (dir.y < 0.13) dir.y = 0.13;
    dir.normalize();

    const tangent = new THREE.Vector3().crossVectors(dir, up).normalize();
    const dir2 = dir.clone().addScaledVector(tangent, 0.026 + Math.random() * 0.035).normalize();
    shootState.start.copy(camera.position).addScaledVector(dir, 14000);
    shootState.end.copy(camera.position).addScaledVector(dir2, 14000);
    shootState.active = true;
    shootState.progress = 0;
    shootState.duration = 1.0 + Math.random() * 0.7;
    shootingStar.visible = true;
  }

  function updateShootingStar(dt) {
    const canShow = app.time === 'night'
      && app.weather !== 'overcast'
      && app.live.numbers.starVisibility > 0.25;
    if (!canShow) {
      shootState.active = false;
      shootingStar.visible = false;
      shootMaterial.opacity = 0;
      return;
    }

    if (!shootState.active) {
      shootState.timer -= dt;
      if (shootState.timer <= 0) spawnShootingStar();
      return;
    }

    shootState.progress += dt / shootState.duration;
    const p = shootState.progress;
    if (p >= 1) {
      shootState.active = false;
      shootingStar.visible = false;
      shootState.timer = 26 + Math.random() * 28;
      return;
    }

    const head = shootState.start.clone().lerp(shootState.end, p);
    const tailP = Math.max(0, p - 0.22);
    const tail = shootState.start.clone().lerp(shootState.end, tailP);
    shootPositions[0] = tail.x; shootPositions[1] = tail.y; shootPositions[2] = tail.z;
    shootPositions[3] = head.x; shootPositions[4] = head.y; shootPositions[5] = head.z;
    shootGeometry.attributes.position.needsUpdate = true;
    shootMaterial.opacity = Math.sin(Math.PI * p) * 0.55;
  }

  /* =========================================================================
     12. RESIZE / ADAPTIVE QUALITY
     ========================================================================= */

  let activePixelRatio = MAX_DPR;
  let qualityReduced = false;
  let perfTime = 0;
  let perfFrames = 0;

  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(activePixelRatio);
    renderer.setSize(w, h, false);
    resizeReflectionTarget();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 140));

  function monitorQuality(dt) {
    if (qualityReduced || !app.ready) return;
    perfTime += dt;
    perfFrames++;
    if (perfTime < 4.5) return;
    const avg = perfTime / Math.max(1, perfFrames);
    if (avg > 0.025 && activePixelRatio > 1.05) {
      activePixelRatio = Math.max(1, activePixelRatio * 0.78);
      reflectionScale = Math.max(0.3, reflectionScale * 0.82);
      qualityReduced = true;
      onResize();
    }
    perfTime = 0;
    perfFrames = 0;
  }

  /* =========================================================================
     13. ANIMATION LOOP
     ========================================================================= */

  const clock = new THREE.Clock();
  let elapsed = 0;

  function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;

    // Smooth, time-based preset cross-fades. Geometry never changes.
    dampPreset(app.live, app.target, dt, 1.38);

    applyArrowPan(dt);
    controls.update();

    if (resetTween) {
      resetTween.t += dt;
      const k = clamp(resetTween.t / resetTween.duration, 0, 1);
      const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      camera.position.lerpVectors(resetTween.fromPos, resetTween.toPos, e);
      controls.target.lerpVectors(resetTween.fromTarget, resetTween.toTarget, e);
      camera.lookAt(controls.target);
      if (k >= 1) {
        const done = resetTween.onDone;
        resetTween = null;
        // 飞行结束后不再恢复环绕：startFly 已经把它关掉，
        // 标准明确要求自动环绕"不得被动画自动恢复"。
        if (done) done();
      }
    }

    applyLiveState(elapsed);
    updateRain(dt);
    updateLightning(dt);
    if (lightning > 0.001) {
      const flash = lightning * lightning;
      renderer.toneMappingExposure = app.live.numbers.exposure * (1 + flash * 0.85);
      ambientLight.intensity += flash * 0.9;
    }
    updateShootingStar(dt);
    updateRipples(dt);
    updateSpray(dt);
    updateMist(elapsed);

    camera.updateMatrixWorld(true);
    renderPlanarReflection();
    skyMaterial.uniforms.uInvProjection.value.copy(camera.projectionMatrixInverse);
    skyMaterial.uniforms.uCameraWorld.value.copy(camera.matrixWorld);
    renderer.render(scene, camera);

    if (!app.ready) {
      app.ready = true;
      window.__uyuniReady = true;
      setTimeout(() => loadingEl.classList.add('is-hidden'), 260);
    }

    monitorQuality(dt);
  }

  animate();

  // Useful for visual debugging without changing the public UI.
  window.__uyuniDebug = { app, scene, camera, controls, renderer, skyMaterial, surfaceMaterial, mountainMaterials, reflectionTarget };
  </script>

<script>
/* BW_V1_SALAR_LAYER — bilingual HUD, rain overlay, test hooks */
(function () {
  var L = {

<!-- Promo bridge: the landing page drives arrow keys through postMessage and hides the in-scene language button. -->
<script>
(function () {
  var embed = false;
  try { embed = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) { /* older browser */ }
  if (embed) {
    var ticks = 0;
    var timer = setInterval(function () {
      var b = document.getElementById('bw-lang');
      if (b) { b.style.display = 'none'; clearInterval(timer); }
      else if (++ticks > 20) clearInterval(timer);
    }, 200);
  }
  var KEYS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
  addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'bw-move') return;
    var key = KEYS[e.data.dir];
    if (!key) return;
    dispatchEvent(new KeyboardEvent(e.data.down ? 'keydown' : 'keyup', { key: key, code: key, bubbles: true }));
  });
})();
</script>
